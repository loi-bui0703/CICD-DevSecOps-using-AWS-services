name: devsecops-factory

# The module files remain independently runnable. `extends` assembles their
# services without duplicating definitions or conflicting on shared resources.
services:
  git-server:
    extends:
      file: docker-compose.infra.yml
      service: git-server

  local-registry:
    extends:
      file: docker-compose.infra.yml
      service: local-registry

  docker-engine:
    extends:
      file: docker-compose.infra.yml
      service: docker-engine

  jenkins:
    extends:
      file: docker-compose.infra.yml
      service: jenkins

  sonarqube:
    extends:
      file: docker-compose.security.yml
      service: sonarqube

  prometheus:
    extends:
      file: docker-compose.obs.yml
      service: prometheus

  blackbox-exporter:
    extends:
      file: docker-compose.obs.yml
      service: blackbox-exporter

  grafana:
    extends:
      file: docker-compose.obs.yml
      service: grafana

networks:
  devsecops:
    name: ${DOCKER_NETWORK:-devsecops}
    external: true

volumes:
  gitops_data:
  jenkins_home:
  registry_data:
  docker_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  prometheus_data:
  grafana_data:
