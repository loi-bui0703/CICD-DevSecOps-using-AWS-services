# =============================================================================
# docker-compose.monitoring.yml — Member 5 (Observability & QA)
# Standalone local monitoring stack with Prometheus & Grafana
#
# Usage:
#   docker compose -f monitoring/docker-compose.monitoring.yml up -d
#
# Access:
#   - Prometheus UI: http://localhost:9090
#   - Grafana UI:    http://localhost:3000 (admin/admin123)
# =============================================================================

networks:
  devsecops:
    name: ${DOCKER_NETWORK:-devsecops}
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:

services:
  # ── Prometheus Time-Series Database ───────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: devsecops-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - devsecops

  # ── Grafana Metrics & Log Visualization ───────────────────────────────────
  grafana:
    image: grafana/grafana:10.3.1
    container_name: devsecops-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - devsecops
