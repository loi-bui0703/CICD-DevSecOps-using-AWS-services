# Production uses the same local Git remote. Jenkins only updates this overlay
# after the manual production approval stage.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tetris-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://gitops-git-server:9418/devsecops.git
    targetRevision: cicd-gitops
    path: kubernetes/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
