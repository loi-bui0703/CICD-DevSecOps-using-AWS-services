# Argo CD continuously reconciles the staging overlay after Jenkins commits an
# immutable image tag to the GitOps branch.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tetris-staging
  namespace: argocd
spec:
  project: default
  
  source:
    repoURL: https://github.com/loi-bui0703/FCAJ-final-project.git
    targetRevision: main
    path: kubernetes/overlays/staging
  
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
