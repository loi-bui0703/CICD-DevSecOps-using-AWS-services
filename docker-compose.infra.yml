# =============================================================================
# docker-compose.infra.yml — Owner by Nhat linh (Infrastructure + CI/CD)
#
# Services: Jenkins CI and a local Docker Registry fallback.
#
# Run standalone (Team 1 testing):
#   docker compose -f docker-compose.infra.yml up -d
#
# Run as part of full stack (root compose includes this):
#   docker compose up -d   (from repo root)
# =============================================================================

networks:
  devsecops:
    name: ${DOCKER_NETWORK:-devsecops}
    external: true

volumes:
  jenkins_home:
  registry_data:
  docker_data:

services:

  local-registry:
    image: registry:2.8.3
    container_name: local-registry
    restart: unless-stopped
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    ports:
      - "${LOCAL_REGISTRY_PORT:-5001}:5000"
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - devsecops
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5000/v2/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Isolated Docker engine for Jenkins builds. This prevents the controller
  # from mounting the host Docker socket, which would grant host-level control.
  docker-engine:
    image: docker:27.5.1-dind
    container_name: devsecops-docker-engine
    restart: unless-stopped
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command:
      - "--host=tcp://0.0.0.0:2375"
      - "--storage-driver=overlay2"
      - "--insecure-registry=local-registry:5000"
    volumes:
      - docker_data:/var/lib/docker
    networks:
      - devsecops
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Jenkins CI
  # Pipeline orchestrator. GitHub source + AWS ECR registry
  # Port: 8080 UI, 50000 agent
  jenkins:
    container_name: jenkins
    image: devsecops-jenkins:local
    restart: unless-stopped

    build: 
      context: .
      dockerfile: ci/Dockerfile.master


    environment:
      DOCKER_HOST: tcp://docker-engine:2375
      DOCKER_TLS_CERTDIR: ""
      REGISTRY: ${REGISTRY:-local-registry:5000}
      REPO_NAME: ${REPO_NAME:-devsecops/tetris}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      GITOPS_REPO_URL: ${GITOPS_REPO_URL:-https://github.com/loi-bui0703/FCAJ-final-project.git}
      GITHUB_USERNAME: ${GITHUB_USERNAME:-x-access-token}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      JENKINS_ADMIN_PASS: ${JENKINS_ADMIN_PASS:-change-me-before-use}
      SONAR_TOKEN: ${SONAR_TOKEN:-}
      DEFECTDOJO_API_KEY: ${DEFECTDOJO_API_KEY:-}
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
        -Dorg.jenkinsci.plugins.durabletask.BourneShellScript.HEARTBEAT_CHECK_INTERVAL=86400
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc_configs
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./:/workspace/source:ro
      - ./ci/jenkins-casc.yaml:/var/jenkins_home/casc_configs/jenkins.yaml:ro
      - ./ci/plugins.txt:/usr/share/jenkins/ref/plugins.txt:ro
    depends_on:
      local-registry:
        condition: service_healthy
      docker-engine:
        condition: service_healthy
    networks:
      - devsecops
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/login"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
